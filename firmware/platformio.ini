; AgentPhone HID dongle firmware for ESP32-S3 (BLE HID combo).
; UNTESTED ON HARDWARE. See README.md.
;
; Two environments, one per USB port of an ESP32-S3-DevKitC-1 style board:
;   esp32s3-native-usb : PC talks to the native USB port (USB-Serial/JTAG, VID:PID 303A:1001)
;   esp32s3-uart       : PC talks to the UART port (CP210x / CH340 bridge)

[platformio]
default_envs = esp32s3-native-usb

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -DAGENTPHONE_FW_MAJOR=0
    -DAGENTPHONE_FW_MINOR=1
    -DAGENTPHONE_FW_PATCH=0
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

[env:esp32s3-native-usb]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3-uart]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
