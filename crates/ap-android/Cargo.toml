[package]
name = "ap-android"
description = "Android backend over adb: screencap, input, am start, UI dump."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The adb server protocol is spoken directly over tokio TCP (see src/adb.rs).
# adb_client 3.2.3 is blocking (std::net) and pulls USB/mDNS/crypto deps we do
# not need, so this crate does not use it.
[dependencies]
ap-core.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
base64.workspace = true

[dev-dependencies]
tokio.workspace = true

