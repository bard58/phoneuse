name: CI

on:
  push:
    branches: [master, main, rust-rewrite]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        # "default": the shipped build (no OCR, no Jev). "all": --all-features.
        features: [default, all]
    env:
      FEATURE_FLAGS: ${{ matrix.features == 'all' && '--all-features' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - run: cargo fmt --all -- --check
      # --workspace includes ap-hid (experimental, not in default-members).
      - run: cargo clippy --workspace --all-targets --locked ${{ env.FEATURE_FLAGS }} -- -D warnings
      - run: cargo test --workspace --locked ${{ env.FEATURE_FLAGS }}
      - if: matrix.features == 'default'
        run: cargo build --release --locked -p ap-cli
      - if: matrix.features == 'default'
        uses: actions/upload-artifact@v4
        with:
          name: agentphone-${{ matrix.os }}
          path: |
            target/release/agentphone
            target/release/agentphone.exe
          if-no-files-found: error
