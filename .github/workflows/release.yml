name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - run: cargo build --release --locked -p ap-cli --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "agentphone-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/agentphone.exe, LICENSE, README.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          name="agentphone-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/agentphone LICENSE README.md "$name"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: agentphone-*.*

  universal-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-apple-darwin"
          merge-multiple: true
      - run: |
          for f in agentphone-*-apple-darwin.tar.gz; do tar xzf "$f"; done
          name="agentphone-${{ github.ref_name }}-universal-apple-darwin"
          mkdir -p "$name"
          lipo -create -output "$name/agentphone" \
            agentphone-*-aarch64-apple-darwin/agentphone agentphone-*-x86_64-apple-darwin/agentphone
          cp LICENSE README.md "$name"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: universal-apple-darwin
          path: agentphone-*-universal-apple-darwin.tar.gz

  publish:
    needs: [build, universal-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            agentphone-*.zip
            agentphone-*.tar.gz
          generate_release_notes: true
