[workspace]
resolver = "3"
members = ["crates/*"]
# ap-hid is experimental: it stays a member (CI builds and tests it with
# --workspace) but a plain `cargo build` / `cargo test` skips it.
default-members = [
    "crates/ap-agent",
    "crates/ap-android",
    "crates/ap-cli",
    "crates/ap-core",
    "crates/ap-ios",
    "crates/ap-jev",
    "crates/ap-llm",
    "crates/ap-mcp",
    "crates/ap-screen",
    "crates/ap-vision",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Minimum: let-chains, image 0.25.10 and rmcp 3.9.0 need 1.88. The `ocr` feature
# (rten 0.26.0) needs 1.94. CI checks 1.88 in the `msrv` job.
rust-version = "1.88"
license = "MIT"
authors = ["AgentPhone contributors", "Aleksey Smolenchuk (original phoneuse)"]
repository = "https://github.com/bard58/phoneuse"
homepage = "https://github.com/bard58/phoneuse"
readme = "README.md"
keywords = ["iphone", "android", "automation", "agent", "mcp"]
categories = ["command-line-utilities", "development-tools::testing"]

[workspace.dependencies]
# Internal crates
ap-core = { path = "crates/ap-core", version = "0.1.0" }
ap-ios = { path = "crates/ap-ios", version = "0.1.0" }
ap-android = { path = "crates/ap-android", version = "0.1.0" }
ap-hid = { path = "crates/ap-hid", version = "0.1.0" }
ap-screen = { path = "crates/ap-screen", version = "0.1.0" }
ap-vision = { path = "crates/ap-vision", version = "0.1.0" }
ap-llm = { path = "crates/ap-llm", version = "0.1.0" }
ap-agent = { path = "crates/ap-agent", version = "0.1.0" }
ap-mcp = { path = "crates/ap-mcp", version = "0.1.0" }
ap-jev = { path = "crates/ap-jev", version = "0.1.0" }

# External crates (versions verified 2026-11-08, see docs/ANALYSIS.md section 5)
# idevice is pre-0.2: pin exactly. Use rustls with the `ring` provider (no OpenSSL, no aws-lc build).
idevice = { version = "=0.1.68", default-features = false, features = [
    "ring",
    "usbmuxd",
    "tcp",
    "pair",
    "rsd",
    "core_device",
    "core_device_proxy",
    "tunnel_tcp_stack",
    "dvt",
    "installation_proxy",
    "springboardservices",
    "mobile_image_mounter",
    "amfi",
    "tss",
    "heartbeat",
    "display_stream",
    "remote_pairing",
] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "fs", "process", "signal"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json", "stream", "charset", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive", "env"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
async-trait = "0.1.92"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23.1"
toml = "1.2.1"
directories = "6.0.0"
rmcp = { version = "3.9.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
futures = "0.3.34"
adb_client = "3.2.3"
serialport = "4.10.1"
mdns-sd = "0.21.7"
# TLS crypto provider for reqwest (rustls-no-provider): ring, installed by ap-llm.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# ap-ios: displayservice session ids (idevice takes uuid::Uuid).
uuid = { version = "1.26.1", features = ["v4"] }
# ap-mcp: streamable HTTP transport (serves rmcp's tower service on 127.0.0.1).
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# OCR is very slow without optimization: build it optimized in dev and test too.
[profile.dev.package.ocrs]
opt-level = 3

[profile.dev.package.rten]
opt-level = 3

[profile.dev.package.rten-base]
opt-level = 3

[profile.dev.package.rten-gemm]
opt-level = 3

[profile.dev.package.rten-imageproc]
opt-level = 3

[profile.dev.package.rten-onnx]
opt-level = 3

[profile.dev.package.rten-parallel]
opt-level = 3

[profile.dev.package.rten-shape-inference]
opt-level = 3

[profile.dev.package.rten-simd]
opt-level = 3

[profile.dev.package.rten-tensor]
opt-level = 3

[profile.dev.package.rten-vecmath]
opt-level = 3
